
<!DOCTYPE html>
<html>
<head>
    <title>Cloud and Dog Animation</title>

    <style>
        center
       
        .scene {
            width: 700px;
            height: 400px;
            border: 3px solid black;
            position: relative;
            overflow: hidden;
            background: rgb(18, 120, 160);
        }

        /* Clouds */
        .cloud {
            position: absolute;
            font-size: 60px;
            left: -100px;
            animation: cloudMove 8s linear infinite;
        }

        .cloud1 {
            top: 30px;
        }

        .cloud2 {
            top: 100px;
            animation-delay: 3s;
        }

        @keyframes cloudMove {
            from { left: -100px; }
            to { left: 750px; }
        }


        /* Road */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height:200px;
            background: #555;
        }

        .road::after {
            content: "";
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            border-top: 4px dashed white;
        }

        /* Dog */
        .dog {
            position: absolute;
            bottom: 65px;
            right: -100px;
            font-size: 65px;
            animation: dogMove 7s linear infinite;
        }

        @keyframes dogMove {
            from { right: -100px; }
            to { right: 750px; }
        }

    </style>
</head>

<body>



    <div class="scene">

        <!-- Clouds -->
        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>


        <!-- Road -->
        <div class="road"></div>

        <!-- Dog -->
        <div class="dog">🐕</div>

    </div>

</body>
</html>
